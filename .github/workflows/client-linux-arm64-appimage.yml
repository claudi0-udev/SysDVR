name: SysDVR-Client AppImage linux arm64

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

jobs:
  build-arm64-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SysDVR
        uses: actions/checkout@v4

      - name: Checkout CimguiSDL2Cross
        uses: actions/checkout@v4
        with:
          repository: exelix11/CimguiSDL2Cross
          path: CimguiSDL2Cross
          submodules: recursive

      - name: Install Cross Compiler and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libusb-1.0-0-dev cmake
          curl -sSL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.30.1.tar.gz
          tar -xzf sdl2.tar.gz
          cp -r SDL-release-2.30.1/include/* CimguiSDL2Cross/cimgui/imgui/backends/

      - name: Compile cimgui.so for ARM64
        run: |
          cd CimguiSDL2Cross
          if [ -f "apply_patches.sh" ]; then
            bash apply_patches.sh || true
          fi
          mkdir -p build_arm64 && cd build_arm64
          aarch64-linux-gnu-g++ -shared -fPIC -O2 \
            -I../cimgui -I../cimgui/imgui -I../cimgui/imgui/backends \
            -DIMGUI_DISABLE_OBSOLETE_FUNCTIONS=1 \
            -DIMGUI_IMPL_API='extern "C"' \
            ../cimgui/cimgui.cpp \
            ../cimgui/imgui/imgui.cpp \
            ../cimgui/imgui/imgui_draw.cpp \
            ../cimgui/imgui/imgui_demo.cpp \
            ../cimgui/imgui/imgui_widgets.cpp \
            ../cimgui/imgui/imgui_tables.cpp \
            ../cimgui/imgui/backends/imgui_impl_sdl2.cpp \
            ../cimgui/imgui/backends/imgui_impl_sdlrenderer2.cpp \
            -o cimgui.so

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish SysDVR Client (linux-arm64)
        run: |
          mkdir -p Client/Platform/Resources/linux-arm64/native
          cp CimguiSDL2Cross/build_arm64/cimgui.so Client/Platform/Resources/linux-arm64/native/cimgui.so
          dotnet publish Client/Client.csproj -c Release -r linux-arm64 -p:PublishAot=false --self-contained true -o ./published-arm64

      - name: Create AppDir Structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          cp -r published-arm64/* AppDir/usr/bin/
          cp CimguiSDL2Cross/build_arm64/cimgui.so AppDir/usr/lib/
          cp CimguiSDL2Cross/build_arm64/cimgui.so AppDir/usr/bin/

          cp Client/Platform/Linux/com.github.exelix11.sysdvr.desktop AppDir/com.github.exelix11.sysdvr.desktop
          cp Client/Platform/Linux/flatpak_icon.png AppDir/com.github.exelix11.sysdvr.png
          cp Client/Platform/Linux/flatpak_icon.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=$(dirname "$SELF")
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/bin:${HERE}/usr/bin/runtimes/linux-arm64/native:/usr/lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/SysDVR-Client" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download appimagetool and Build AppImage
        run: |
          curl -sSL -o runtime-aarch64 https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-aarch64
          curl -sSL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=aarch64 ./squashfs-root/AppRun --runtime-file runtime-aarch64 --no-appstream AppDir SysDVR-Client-aarch64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-Client-aarch64.AppImage
          path: SysDVR-Client-aarch64.AppImage
